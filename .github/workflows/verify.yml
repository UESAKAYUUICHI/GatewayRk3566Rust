name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ForAI/source
    steps:
      - uses: actions/checkout@v6
        with:
          path: ForAI/source
      - name: Check backend file size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path("crates").rglob("*.rs") if "gw-ui" not in p.parts]
          oversized = [str(p) for p in files if len(p.read_text(encoding="utf-8").splitlines()) > 400]
          assert not oversized, oversized
          PY
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked
        env:
          CARGO_TARGET_DIR: ../build/cargo
